# Override para desarrollo
# Usar con: docker compose -f deploy/docker-compose.yml -f config/development/docker-compose.override.yml
# Ver: https://docs.docker.com/compose/extends/

services:
  chroma:
    ports:
      - "127.0.0.1:8200:8000"  # Acceso directo para desarrollo local fuera de Docker



  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile.dev
    volumes:
      - ../src/api:/app
    environment:
      ENV: development
      DEBUG: "true"
      # Forzar uso del nombre del servicio Docker cuando está en contenedor
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    command: python main.py

  django:
    environment:
      DEBUG: "True"
      N8N_URL: "http://n8n:5678"
    volumes:
      # Código fuente — cambios en settings, templates y vistas se reflejan sin rebuild
      # Nota: paths relativos se resuelven desde deploy/ (directorio del primer compose file)
      - ../dj/core:/app/core
      - ../dj/dashboard:/app/dashboard
      - ../dj/audit:/app/audit
      # CSS compilado por `make tailwind-dev` en el host
      - ../dj/static:/app/static
      # Volumen anónimo: vacía el staticfiles baked en la imagen para que
      # whitenoise no sirva CSS stale y pase los requests a Django staticfiles
      - /app/staticfiles
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --reload --timeout 120 core.wsgi:application

