{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="pozo-silk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}n8n Dashboard{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block extra_head %}{% endblock %}
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-base-200 text-base-content min-h-screen flex flex-col">
    <nav class="bg-base-100 shadow-sm border-b border-base-200">
        <div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex items-center">
                        <a href="{% url 'index' %}" class="text-xl font-bold text-primary tracking-tight">n8n<span class="text-base-content">Manager</span></a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}border-primary text-base-content{% else %}border-transparent text-base-content opacity-50 hover:border-base-300 hover:text-primary{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="{% url 'chat_history' %}" class="{% if request.resolver_match.url_name == 'chat_history' %}border-primary text-base-content{% else %}border-transparent text-base-content opacity-50 hover:border-base-300 hover:text-primary{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Chat History
                        </a>
                        <a href="{% url 'audit_index' %}" class="{% if request.resolver_match.url_name == 'audit_index' %}border-primary text-base-content{% else %}border-transparent text-base-content opacity-50 hover:border-base-300 hover:text-primary{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Auditoría
                        </a>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-[1920px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
